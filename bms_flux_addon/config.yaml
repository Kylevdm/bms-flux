---
name: bms-flux
version: "0.1.0"
slug: bms_flux_addon
description: Read-only bridge from a bank of Seplos packs on RS485 to Home Assistant over MQTT
url: https://github.com/Kylevdm/bms-flux
arch:
  - aarch64
  - amd64
init: true
uart: true
startup: services
boot: auto
services:
  - mqtt:need
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Local read-only API (token-gated); leave unmapped unless used
options:
  bus: ""
  packs: []
  snapshot_interval_s: 10
  silent_after_s: 10
  log_level: info
  stream: true
  raw_frames: false
  api_token: ""
  drift_divergence:
    enabled: true
    spread_on_pts: 5
    spread_off_pts: 3
    hold_min: 30
  drift_full_charge:
    enabled: true
    cell_avg_v: 3.45
    max_current_c: 0.05
    hold_min: 15
    soc_below_pct: 95
  drift_rested_ocv:
    enabled: true
    max_current_c: 0.02
    rest_h: 2
    ocv_soc_below_pct: 20
    gap_pts: 10
    min_temp_c: 10
  ocv_table: []
schema:
  bus: str
  packs:
    - address: int(1,16)
      serial: str
      label: str?
  snapshot_interval_s: int(1,300)
  silent_after_s: int(2,120)
  log_level: list(debug|info|warning|error)
  stream: bool
  raw_frames: bool
  api_token: password
  drift_divergence:
    enabled: bool
    spread_on_pts: float
    spread_off_pts: float
    hold_min: int(1,1440)
  drift_full_charge:
    enabled: bool
    cell_avg_v: float
    max_current_c: float
    hold_min: int(1,1440)
    soc_below_pct: float(0,100)
  drift_rested_ocv:
    enabled: bool
    max_current_c: float
    rest_h: int(1,72)
    ocv_soc_below_pct: float(0,100)
    gap_pts: float
    min_temp_c: float(-20,60)
  ocv_table:
    - soc_pct: float(0,100)
      cell_v: float
