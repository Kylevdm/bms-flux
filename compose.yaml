services:
  bms-flux:
    build:
      # The same context the Supervisor uses, so every COPY source is present.
      context: bms_flux_addon
      dockerfile: Dockerfile
      args:
        # Keep the fallback equal to bms_flux_addon/config.yaml's version; the
        # packaging test pins them together. Override with BMS_FLUX_VERSION.
        BUILD_VERSION: "${BMS_FLUX_VERSION:-0.1.0}"
    restart: unless-stopped
    devices:
      - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    environment:
      BMS_FLUX_CONFIG: /config/bms-flux.yaml
      BMS_FLUX_STATE_DIR: /data
    volumes:
      - ./config:/config:ro
      - ./state:/data
    # The local API is not mapped to the host by default. Uncomment and set the
    # host IP if a LAN app needs it; other containers reach the service on the
    # compose network at http://bms-flux:8765.
    # ports:
    #   - "127.0.0.1:8765:8765"
