[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-flux"
version = "0.1.0"
description = "Read-only bridge from a bank of Seplos packs on RS485 to Home Assistant over MQTT"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyserial-asyncio-fast>=0.16",
    "aiomqtt>=2.3",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-PyYAML",
]

[project.scripts]
bms-flux = "bms_flux.cli:main"

[tool.setuptools.packages.find]
include = ["bms_flux*"]

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
packages = ["bms_flux", "tests", "tools"]

[tool.ruff]
# The recorded probe and its reference capture script are read-only artifacts.
extend-exclude = ["probe/"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
